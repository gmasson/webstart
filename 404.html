<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<!-- WebStart 2.0 | https://github.com/gmasson/webstart | Licença MIT -->
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex, nofollow">
	<meta name="description" content="Página não encontrada do template WebStart.">
	<title>Página não encontrada - WebStart</title>

	<!-- Ícones -->
	<link rel="icon" type="image/png" href="assets/img/favicon.png">
	<link rel="icon" type="image/png" sizes="128x128" href="assets/img/icon-128.png">
	<link rel="icon" type="image/png" sizes="192x192" href="assets/img/icon-192.png">
	<link rel="apple-touch-icon" href="assets/img/icon-192.png">

	<!-- PWA -->
	<meta name="theme-color" content="#1d4ed8">
	<link rel="manifest" href="manifest.json">

	<!-- Tailwind CSS via CDN -->
	<script src="https://cdn.tailwindcss.com"></script>

	<!-- Estilos complementares do template -->
	<link rel="stylesheet" href="assets/css/styles.css" type="text/css">
</head>
<body data-theme="light" class="min-h-screen bg-[var(--background-color)] text-[var(--text-color)] antialiased">
	<a class="skip-link" href="#conteudo">Pular para o conteúdo principal</a>

	<!-- Conteúdo principal -->
	<main id="conteudo" class="flex min-h-screen items-center justify-center px-4 py-16" tabindex="-1">
		<section class="w-full max-w-2xl rounded-3xl border border-[var(--border-color)] bg-[var(--surface-color)] p-8 text-center shadow-[var(--shadow-soft)] sm:p-12" aria-labelledby="titulo-erro">
			<img src="assets/img/icon-192.png" class="mx-auto mb-6 h-20 w-20 rounded-3xl" alt="Ícone do WebStart" width="80" height="80">
			<p class="text-sm font-bold uppercase tracking-[0.25em] text-[var(--primary-color)]">Erro 404</p>
			<h1 id="titulo-erro" class="mt-3 text-4xl font-black tracking-tight sm:text-5xl">Página não encontrada</h1>
			<p class="mt-4 text-lg leading-8 text-[var(--muted-color)]">O endereço pode ter sido alterado, removido ou digitado incorretamente.</p>
			<div class="mt-8 flex flex-wrap justify-center gap-3">
				<a class="btn-color" href="/">Voltar ao início</a>
				<a class="inline-flex items-center justify-center rounded-full border border-[var(--border-color)] px-5 py-3 font-semibold text-[var(--text-color)] transition hover:bg-[var(--surface-muted)]" href="https://github.com/gmasson/webstart" target="_blank" rel="noopener noreferrer" aria-label="Abrir o repositório WebStart no GitHub em nova aba">Ver repositório</a>
			</div>
		</section>
	</main>

	<!-- Scripts do template -->
	<script src="assets/js/scripts.js" defer></script>
</body>
</html>
